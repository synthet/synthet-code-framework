<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">PROJECT — app icon</title>
  <desc id="description">Synth app icon family. Flat near-black plate, silver mark, transparent surround. All visible artwork is vector geometry.</desc>
  <defs>
